<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/interiorg-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="description" content="InteriorG — Design • Discover • Transform Your Home" />
    <title>InteriorG — Design • Discover • Transform Your Home</title>
    <!-- PWA & Mobile Web Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B2E5B" />
    <meta name="color-scheme" content="light" />

    <!-- Apple iOS Safari PWA Architecture -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="InteriorG" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

    <!-- Android & Windows PWA Compatibility -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="InteriorG" />
    <meta name="msapplication-TileColor" content="#0B2E5B" />
    <meta name="msapplication-TileImage" content="/icons/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div id="app-loading-fallback" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Inter', system-ui, sans-serif; background: #F5F9FF; color: #1F2937; text-align: center; padding: 2rem;">
        <div style="width: 40px; height: 40px; border: 3px solid #DCE7F5; border-top-color: #2D8CFF; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1.25rem;"></div>
        <h3 style="font-family: 'Montserrat', system-ui, sans-serif; font-weight: 700; margin: 0 0 0.5rem; font-size: 1.35rem; color: #0B2E5B; letter-spacing: -0.02em;">InteriorG</h3>
        <p id="app-loading-msg" style="font-size: 0.875rem; font-weight: 400; margin: 0; color: #4B5563;">Design • Discover • Transform Your Home</p>
        <button id="app-force-reload-btn" type="button" style="display: none; margin-top: 1.5rem; padding: 0.6rem 1.2rem; background: #0B2E5B; color: #ffffff; border: none; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer;">
          Clear Stale Cache & Refresh
        </button>
      </div>
    </div>
    <script>
      function clearAppCachesAndReload() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(r) { r.unregister(); });
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(k) { caches.delete(k); });
          });
        }
        try {
          sessionStorage.setItem('interiorg_cache_auto_healed', '1');
        } catch (e) {}
        setTimeout(function() {
          window.location.reload();
        }, 300);
      }

      // Immediate error listener for stale chunk / module script load failures
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? e.message : '';
        var isChunkError = (
          msg.indexOf('Loading chunk') !== -1 ||
          msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
          msg.indexOf('MIME type') !== -1 ||
          msg.indexOf('module script') !== -1
        );
        if (isChunkError && !sessionStorage.getItem('interiorg_cache_auto_healed')) {
          clearAppCachesAndReload();
        }
      });

      // Diagnostic timeout: if React hasn't replaced #root within 3.5s (due to old service worker caching), reveal recovery action
      setTimeout(function() {
        var fallback = document.getElementById('app-loading-fallback');
        var btn = document.getElementById('app-force-reload-btn');
        var msg = document.getElementById('app-loading-msg');
        if (fallback && btn) {
          if (!sessionStorage.getItem('interiorg_cache_auto_healed')) {
            clearAppCachesAndReload();
            return;
          }
          msg.textContent = 'Browser cache or previous session conflict detected.';
          btn.style.display = 'inline-block';
          btn.onclick = function() {
            try {
              localStorage.clear();
              sessionStorage.clear();
            } catch (e) {}
            clearAppCachesAndReload();
          };
        }
      }, 3500);
    </script>
    <!-- Cloudflare Web Analytics -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "interiorg-insights"}'></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
