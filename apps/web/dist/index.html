    <!-- PWA & Mobile Web Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#141414" />
    <meta name="color-scheme" content="light" />

    <!-- Apple iOS Safari PWA Architecture -->
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Android & Windows PWA Compatibility -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="InteriorG" />
    <meta name="msapplication-TileColor" content="#141414" />
    <meta name="msapplication-TileImage" content="/icons/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400;1,6..96,500&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/assets/index-BcksMSmW.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BeO0MpYc.css">
  </head>
  <body>
    <div id="root">
      <div id="app-loading-fallback" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #ffffff; color: #0a192f; text-align: center; padding: 2rem;">
        <div style="width: 40px; height: 40px; border: 3px solid #e2e8f0; border-top-color: #0f2444; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1.25rem;"></div>
        <h3 style="font-family: 'Playfair Display', Georgia, serif; font-style: italic; margin: 0 0 0.5rem; font-size: 1.25rem; color: #0a192f;">InteriorG Studio</h3>
        <p id="app-loading-msg" style="font-size: 0.85rem; font-weight: 400; margin: 0; color: #536b88;">Loading sanctuary collection...</p>
        <button id="app-force-reload-btn" type="button" style="display: none; margin-top: 1.5rem; padding: 0.6rem 1.2rem; background: #0f2444; color: #ffffff; border: none; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer;">
          Clear Stale Cache & Refresh
        </button>
      </div>
    </div>
    <script>
      // Diagnostic timeout: if React hasn't replaced #root within 3.5s (due to old service worker caching), reveal recovery action
      setTimeout(function() {
        var fallback = document.getElementById('app-loading-fallback');
        var btn = document.getElementById('app-force-reload-btn');
        var msg = document.getElementById('app-loading-msg');
        if (fallback && btn) {
          msg.textContent = 'Browser cache or previous session conflict detected.';
          btn.style.display = 'inline-block';
          btn.onclick = function() {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            localStorage.clear();
            sessionStorage.clear();
            window.location.reload(true);
          };
        }
      }, 3500);
    </script>
    <!-- Cloudflare Web Analytics -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "interiorg-insights"}'></script>
  </body>
</html>
