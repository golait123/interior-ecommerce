services:
  postgres:
    image: postgres:17-alpine
    container_name: interior-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: interior
      POSTGRES_PASSWORD: interior_dev
      POSTGRES_DB: interior_ecommerce
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://interior:interior_dev@postgres:5432/interior_ecommerce?schema=public
      JWT_SECRET: change-me-in-production
      PORT: 4000
    depends_on: [postgres]
    ports: ["4000:4000"]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: http://localhost:4000/api/v1
    depends_on: [api]
    ports: ["5173:5173"]
volumes:
  postgres_data:
