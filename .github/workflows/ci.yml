name: InteriorG DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/interiorg_test_db?schema=public
  JWT_SECRET: ci-test-secret-key-32-chars-long-minimum!
  NODE_ENV: test

jobs:
  # ============================================================================
  # STAGE 1: SECURITY SCANNING & STATIC COMPOSITION ANALYSIS (DevSecOps Gate)
  # ============================================================================
  security-audit:
    name: 🛡️ Security Audit & Secret Detection (SAST/SCA)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      # Secret Detection Gate (Verifies zero credentials or .env secrets committed)
      - name: 🔍 Git Secret Leak & Environment Verification
        run: |
          echo "Scanning git repository for committed secrets..."
          if git ls-files | grep -E '^\.env$|\.env\.local$|\.env\.production$'; then
            echo "❌ CRITICAL: Sensitive environment file detected in git tracking!"
            exit 1
          else
            echo "✅ Zero tracked .env files detected. Secret isolation policy validated."
          fi

      # Software Composition Analysis (SCA) - Dependency Vulnerability Audit
      - name: 🔒 Software Composition Analysis (npm audit)
        run: npm audit --audit-level=critical
        continue-on-error: true

  # ============================================================================
  # STAGE 2: STATIC APPLICATION ANALYSIS & MONOREPO TYPECHECK (SAST)
  # ============================================================================
  static-analysis:
    name: 🔍 Static Analysis & Type Checking (SAST)
    runs-on: ubuntu-latest
    needs: [security-audit]
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install monorepo dependencies
        run: npm ci

      - name: 📐 Validate Prisma Database Schema
        run: npx prisma validate --schema=apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/interiorg_test_db?schema=public

      - name: ⚙️ Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/interiorg_test_db?schema=public

      - name: 🛡️ Strict Monorepo Typecheck (apps/api & apps/web)
        run: npm run typecheck

  # ============================================================================
  # STAGE 3: AUTOMATED INTEGRATION & UNIT TEST SUITE (Live Containers)
  # ============================================================================
  test-suite:
    name: 🧪 Automated Test Suite (Postgres & Mongo Containers)
    runs-on: ubuntu-latest
    needs: [static-analysis]
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: interiorg_test_db
        ports:
          - 5432:5432

      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install monorepo dependencies
        run: npm ci

      - name: ⚙️ Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/interiorg_test_db?schema=public

      - name: 🗄️ Verify Database Schema Push against Container
        run: |
          for i in $(seq 1 30); do
            if npx prisma db push --schema=apps/api/prisma/schema.prisma --skip-generate; then
              echo "✅ PostgreSQL service container online & synchronized"
              exit 0
            fi
            echo "Waiting for postgres ($i/30)..."
            sleep 2
          done
          exit 1
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/interiorg_test_db?schema=public

      - name: 🧪 Execute Monorepo Unit & Integration Test Suites
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/interiorg_test_db?schema=public
          MONGODB_URI: mongodb://localhost:27017/interiorg_test_db
          JWT_SECRET: ci-test-secret-key-32-chars-long-minimum!

  # ============================================================================
  # STAGE 4: DOCKER CONTAINER IMAGE BUILD & VERIFICATION
  # ============================================================================
  docker-build:
    name: 🐳 Docker Container Build & Verification
    runs-on: ubuntu-latest
    needs: [test-suite]
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Backend API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: interiorg-api:ci-test

      - name: 🎨 Build Frontend Web Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: interiorg-web:ci-test
          build-args: |
            VITE_API_URL=/api/v1

  # ============================================================================
  # STAGE 5: PRODUCTION COMPILE, ARTIFACT PACKAGING & DEPLOYMENT
  # ============================================================================
  build-and-archive:
    name: 📦 Production Compilation & Artifact Packaging
    runs-on: ubuntu-latest
    needs: [docker-build]
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install monorepo dependencies
        run: npm ci

      - name: ⚙️ Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/interiorg_test_db?schema=public

      - name: 🏗️ Compile Backend Production API
        run: npm run build -w apps/api

      - name: 🎨 Compile Frontend Edge Production Bundle
        run: npm run build -w apps/web
        env:
          VITE_API_URL: https://api.interiorg.com/api/v1

      - name: 📤 Archive Web Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: interiorg-production-dist
          path: apps/web/dist
          retention-days: 7

      # Continuous Deployment to Cloudflare Pages (When secret is available on main)
      - name: 🚀 Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx wrangler pages deploy apps/web/dist --project-name interiorg --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
